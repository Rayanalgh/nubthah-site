name = "nubthah"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# الدومين
routes = [
  { pattern = "nubthah.com", custom_domain = true },
  { pattern = "www.nubthah.com", custom_domain = true }
]

# الصفحات يخدمها Cloudflare مباشرة، والسيرفر يستقبل /api بس
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
# Client ID حق Google (مو سر) — نفس القيمة اللي في public/index.html
GOOGLE_CLIENT_ID = ""

# قاعدة بيانات الحسابات والسير (تنشأ تلقائيًا أول نشر)
[[d1_databases]]
binding = "DB"
database_name = "nubthah"

# تذكير انتهاء الرخص — يوميًا ٩ صباحًا بتوقيت السعودية
[triggers]
crons = ["0 6 * * *"]
